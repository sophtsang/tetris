ver = "0.4.1"

name = "Runt Tests"

[[tests]]
name = "Single Player Tests"
paths = ["single-player/*.txt"]
cmd = "../target/release/p5_tetris --simulate-inputs-single-player {} --resources ../resources"

[[tests]]
name = "Multi Player Tests"
paths = ["multi-player/*.txt"]
cmd = "P1=$(mktemp) && P2=$(mktemp) && head -n1 {} > $P1 && tail -n1 {} > $P2 && ../target/release/p5_tetris --resources ../resources --simulate-inputs-multi-player $P1 --simulate-inputs-multi-player $P2 && rm $P1 && rm $P2"
